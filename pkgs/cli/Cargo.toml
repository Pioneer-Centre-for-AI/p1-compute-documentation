[package]
name = "aicentre"
version = "0.2.0-rc.1"
edition = "2024"
description = "Command line tool for the P1 HPC clusters"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "aicentre"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
hex = "0.4.3"
jiff = "1.0.0"
libc = "0.2.191"
nix = { version = "0.32.0", features = ["signal", "process", "user", "fs", "term", "hostname"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "net", "time", "signal", "io-util", "io-std", "sync", "fs"] }
tokio-util = "0.7.20"
toml = "1.2.1"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
which = "8.0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
