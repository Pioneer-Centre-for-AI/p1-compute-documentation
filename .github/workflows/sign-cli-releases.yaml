name: Sign CLI releases

on:
  push:
    branches: [main]
    paths:
      - pkgs/cli/release.pub
      - pkgs/cli/scripts/sign-release.sh
      - .github/workflows/sign-cli-releases.yaml
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to sign again, such as cli-v0.1.2. Empty signs every release that has no signature.
        required: false
        default: ''

permissions: {}

concurrency:
  group: sign-cli-releases
  cancel-in-progress: false

jobs:
  sign:
    name: Sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pkgs/cli
          sparse-checkout-cone-mode: false

      - name: Sign
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEY: ${{ secrets.AICENTRE_RELEASE_KEY }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::the secret AICENTRE_RELEASE_KEY is not set"
            exit 1
          fi
          key="$RUNNER_TEMP/release-key"
          (umask 077 && printf '%s\n' "$RELEASE_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          # shellcheck disable=SC2086
          pkgs/cli/scripts/sign-release.sh "$key" $TAG
