name: CLI

on:
  push:
    branches: [main]
    paths: ['pkgs/cli/**', '.github/workflows/cli.yaml', 'flake.nix', 'flake.lock']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required check must report on every pull request, so the workflow always
  # runs and the CLI jobs are skipped when nothing of the CLI changed.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cli: ${{ steps.diff.outputs.cli }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo cli=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(pkgs/cli/|\.github/workflows/cli\.yaml$|flake\.(nix|lock)$)'; then
            echo cli=true >> "$GITHUB_OUTPUT"
          else
            echo cli=false >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pkgs/cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pkgs/cli

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
        env:
          AICENTRE_E2E: '1'

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh install.sh
          shellcheck -s bash scripts/install-check.sh scripts/sign-release.sh

  static:
    name: Static Linux build
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pkgs/cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # For development. Not signed, not a release.
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/aicentre | grep -Eq 'statically linked|static-pie linked'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aicentre-linux-x64-static
          path: pkgs/cli/target/x86_64-unknown-linux-musl/release/aicentre
          if-no-files-found: error
          retention-days: 14

  nix:
    name: Nix package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix build .#aicentre --print-build-logs

      - name: Smoke test
        run: ./result/bin/aicentre --version

  ci:
    name: CLI
    needs: [changes, test, static, nix]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
