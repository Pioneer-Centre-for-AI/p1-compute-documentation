name: CLI

on:
  push:
    branches: [main]
    paths: ['pkgs/cli/**', '.github/workflows/cli.yaml', 'flake.nix', 'flake.lock']
  pull_request:
    branches: [main]
    paths: ['pkgs/cli/**', '.github/workflows/cli.yaml', 'flake.nix', 'flake.lock']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pkgs/cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: pkgs/cli/.bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run lint

      - name: Test
        run: bun test
        env:
          AICENTRE_E2E: '1'

      - name: Lint shell scripts
        if: runner.os == 'Linux'
        run: bun run lint:sh

  nix:
    name: Nix package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build
        run: nix build .#aicentre --print-build-logs

      - name: Smoke test
        run: ./result/bin/aicentre --version
