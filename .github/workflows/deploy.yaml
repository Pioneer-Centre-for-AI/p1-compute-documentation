name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up cachix
        uses: cachix/cachix-action@v15
        with:
          name: nix-community
          # To enable pushing your own derivations to a private cache, set CACHIX_AUTH_TOKEN
          # in repo secrets and replace `name` above with your cache name.
          # authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build site
        run: nix build .#website --print-build-logs

      - name: Materialise static output
        run: |
          mkdir -p site
          cp -RL result/. site/
          chmod -R u+w site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
