name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up cachix
        uses: cachix/cachix-action@v17
        with:
          name: nix-community

      - name: Check
        run: nix flake check --print-build-logs

      - name: Build site
        run: nix build .#website --print-build-logs

      - name: Materialise static output
        run: |
          mkdir -p site
          cp -RL result/. site/
          chmod -R u+w site

      - name: Verify output
        run: |
          for f in index.html 404.html sitemap.xml robots.txt CNAME install gallery/index.json gallery/int-gpu.tar.gz; do
            if [ ! -f "site/$f" ]; then
              echo "::error::expected site/$f in the build output"
              exit 1
            fi
          done
          if [ "$(head -n 1 site/install)" != "#!/bin/sh" ]; then
            echo "::error::site/install is not the aicentre install script"
            exit 1
          fi
          echo "Pages: $(find site -name '*.html' | wc -l), size: $(du -sh site | cut -f1)"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
