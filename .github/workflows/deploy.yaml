name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Set up cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: nix-community

      - name: Check
        run: nix flake check --print-build-logs

      - name: Build site
        run: nix build .#website --print-build-logs

      - name: Materialise static output
        run: |
          mkdir -p site
          cp -RL result/. site/
          chmod -R u+w site

      - name: Verify output
        run: |
          for f in index.html 404.html sitemap.xml robots.txt CNAME install gallery/index.json gallery/int-gpu.tar.gz; do
            if [ ! -f "site/$f" ]; then
              echo "::error::expected site/$f in the build output"
              exit 1
            fi
          done
          if ! cmp -s site/install pkgs/cli/install.sh; then
            echo "::error::site/install is not pkgs/cli/install.sh, byte for byte"
            exit 1
          fi
          echo "Pages: $(find site -name '*.html' | wc -l), size: $(du -sh site | cut -f1)"

      - name: The install script installs the latest release
        run: |
          home="$(mktemp -d)"
          for try in 1 2 3 4 5 6; do
            if HOME="$home" sh site/install < /dev/null; then
              HOME="$home" "$home/.local/bin/aicentre" --version
              exit 0
            fi
            echo "try $try failed"
            sleep 30
          done
          echo "::error::site/install cannot install the latest release. If it has no signature, sign it with pkgs/cli/scripts/sign-release.sh."
          exit 1

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
