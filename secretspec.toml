[project]
name = "aicentre"
revision = "1.0"

# Signing a release by hand:
#   secretspec run --profile release -- sh -c 'pkgs/cli/scripts/sign-release.sh "$AICENTRE_RELEASE_KEY" cli-vX'

[profiles.release]
AICENTRE_RELEASE_KEY = { description = "Ed25519 private key that signs SHA256SUMS (ssh-keygen -Y sign, namespace aicentre-release)", as_path = true }
GH_TOKEN = { description = "GitHub token with contents:write on the repository, for scripts/sign-release.sh" }
